<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeffiRooms — NSUK Student Lodges</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="app" class="container">
    <!-- Navigation -->
    <nav class="topbar">
      <div class="logo syne">Keffi<span style="color:var(--teal-l)">Rooms</span></div>
      <div id="auth-links">
        <button onclick="showScreen('login')">Login</button>
      </div>
    </nav>

    <!-- Hero Section -->
    <section id="hero" class="screen">
      <h1 class="syne">Find Your Perfect <br><span style="color:var(--teal-l)">NSUK Lodge</span></h1>
      <p>Secure, verified student housing in Keffi.</p>
      <div id="listings-grid"></div>
    </section>

    <!-- Detail Screen -->
    <section id="details" class="screen" style="display:none">
      <button onclick="showScreen('hero')">Back</button>
      <div id="listing-content"></div>
    </section>

    <!-- Login Screen -->
    <section id="login" class="screen" style="display:none">
      <h2 class="syne">Login</h2>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit" class="btn-primary">Sign In</button>
      </form>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
